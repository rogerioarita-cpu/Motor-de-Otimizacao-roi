name: Instalador Motor ROI

# Gera o instalador sempre que a VERSAO do programa muda e publica em Releases (tag vX.Y.Z).
# Se a versão já tem release, não gera de novo. Para regerar à mão: aba Actions > Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "motor_roi.py"
      - "requirements.txt"
      - "instalador/**"
      - ".github/workflows/instalador.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instalador
  cancel-in-progress: false

env:
  TIPO: roi
  FONTE: motor_roi.py

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
      nova: ${{ steps.v.outputs.nova }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao=$(sed -nE 's/^VERSAO *= *"([^"]+)".*/\1/p' "$FONTE" | head -1)
          [ -n "$versao" ] || { echo "VERSAO não encontrada em $FONTE"; exit 1; }
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          if gh release view "v$versao" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "nova=false" >> "$GITHUB_OUTPUT"
            echo "A versão v$versao já tem instalador publicado."
          else
            echo "nova=true" >> "$GITHUB_OUTPUT"
            echo "Versão nova: v$versao"
          fi

  instalador:
    needs: versao
    if: needs.versao.outputs.nova == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Montar o instalador
        shell: pwsh
        run: ./instalador/montar_instalador.ps1 -Tipo $env:TIPO -Versao "${{ needs.versao.outputs.versao }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Instalar_Motor_ROI_CC_${{ needs.versao.outputs.versao }}
          path: dist/*.exe
          compression-level: 0
      - name: Publicar em Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: |
          $tag = "v$env:VERSAO"
          $arquivos = (Get-ChildItem dist\*.exe).FullName
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $arquivos --clobber
          } else {
            gh release create $tag $arquivos --target $env:GITHUB_SHA --title "Motor ROI $tag" --generate-notes
          }
          exit $LASTEXITCODE
